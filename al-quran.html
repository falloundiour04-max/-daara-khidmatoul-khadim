<title>Al Quran — Daara Khidmatoul Khadim</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#0d3b2b;
    --green-mid:#155a3f;
    --gray-stone:#4a4a48;
    --cream:#f6f4ee;
    --cream-panel:#eee9dd;
    --gold:#b8935a;
    --ink:#1c221e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Work Sans', sans-serif; line-height:1.5; padding-bottom:5.5rem; }
  a{ color:inherit; text-decoration:none; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:1rem 1.25rem;
    background:rgba(246,244,238,0.95); backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(13,59,43,0.08);
    position:sticky; top:0; z-index:30;
  }
  .brand{ display:flex; align-items:center; gap:0.6rem; }
  .brand img{ height:32px; }
  .brand-text{ font-family:'Amiri', serif; font-weight:700; font-size:0.88rem; color:var(--green-deep); line-height:1.15; }
  .brand-text span{ display:block; font-family:'Work Sans',sans-serif; font-weight:500; font-size:0.56rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gray-stone); margin-top:2px; }
  header nav a{ font-size:0.8rem; font-weight:600; color:var(--green-deep); border:1px solid var(--green-deep); padding:0.45rem 0.9rem; border-radius:999px; }
  header nav a:hover{ background:var(--green-deep); color:var(--cream); }

  .app-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:1.2rem 1.25rem 0.6rem;
    max-width:640px; margin:0 auto;
  }
  .app-title{ display:flex; align-items:center; gap:0.7rem; }
  .app-title .icon{
    width:2.6rem; height:2.6rem; border-radius:14px;
    background:var(--green-deep); color:var(--cream);
    display:flex; align-items:center; justify-content:center;
  }
  .app-title .icon svg{ width:1.4rem; height:1.4rem; }
  .app-title h1{ font-family:'Amiri', serif; font-size:1.15rem; color:var(--green-deep); }
  .app-title p{ font-size:0.75rem; color:var(--gray-stone); text-transform:uppercase; letter-spacing:0.08em; }
  .app-avatar{
    width:2.6rem; height:2.6rem; border-radius:50%;
    background:var(--gold); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .app-avatar svg{ width:1.3rem; height:1.3rem; }

  .tabs{
    display:flex; gap:0.4rem; padding:0.8rem 1.25rem 0;
    max-width:640px; margin:0 auto;
    border-bottom:1px solid rgba(13,59,43,0.12);
  }
  .tab{
    flex:1; text-align:center; padding:0.75rem 0.5rem;
    font-size:0.82rem; font-weight:600; color:var(--gray-stone);
    border-bottom:2.5px solid transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:0.4rem;
  }
  .tab.active{ color:var(--green-deep); border-bottom-color:var(--gold); }
  .tab svg{ width:1rem; height:1rem; }

  .panel{ display:none; max-width:640px; margin:0 auto; padding:1.2rem 1.25rem 1rem; }
  .panel.active{ display:block; }

  .mushaf-list{ display:flex; flex-direction:column; gap:0.8rem; }
  .mushaf-item{
    display:flex; align-items:center; gap:0.9rem;
    background:var(--cream-panel); border:1px solid rgba(13,59,43,0.1);
    border-radius:12px; padding:0.7rem 0.9rem;
    cursor:pointer; transition:transform .2s ease, box-shadow .2s ease;
  }
  .mushaf-item:hover{ transform:translateY(-2px); box-shadow:0 10px 22px rgba(13,59,43,0.12); }
  .mushaf-thumb{
    width:3rem; height:3rem; border-radius:9px; flex-shrink:0;
    background:var(--green-deep); color:var(--cream);
    display:flex; align-items:center; justify-content:center;
  }
  .mushaf-thumb svg{ width:1.4rem; height:1.4rem; }
  .mushaf-info{ flex:1; min-width:0; }
  .mushaf-info h3{ font-size:0.95rem; color:var(--ink); margin-bottom:0.3rem; }
  .mushaf-badge{
    display:inline-flex; align-items:center; gap:0.3rem;
    background:rgba(13,59,43,0.08); color:var(--green-deep);
    font-size:0.72rem; font-weight:600; padding:0.2rem 0.6rem; border-radius:999px;
  }
  .mushaf-chevron{ color:var(--gray-stone); flex-shrink:0; }

  .placeholder-panel{
    text-align:center; padding:3rem 1rem; color:var(--gray-stone);
  }
  .placeholder-panel svg{ width:2.6rem; height:2.6rem; color:var(--gold); margin-bottom:1rem; }
  .placeholder-panel p{ font-size:0.9rem; max-width:32ch; margin:0 auto; }

  .toast{
    position:fixed; left:50%; bottom:6.5rem; transform:translate(-50%, 20px);
    background:var(--ink); color:var(--cream); padding:0.8rem 1.4rem;
    border-radius:999px; font-size:0.82rem; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:100; text-align:center;
    max-width:88vw;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:space-around;
    background:var(--green-deep); padding:0.6rem 0.4rem 0.9rem;
    box-shadow:0 -8px 24px rgba(13,59,43,0.25);
  }
  .bottom-nav a{
    display:flex; flex-direction:column; align-items:center; gap:0.25rem;
    color:rgba(246,244,238,0.65); font-size:0.62rem; font-weight:600;
    padding:0.3rem 0.4rem; border-radius:10px; flex:1; max-width:5.5rem;
  }
  .bottom-nav a svg{ width:1.25rem; height:1.25rem; }
  .bottom-nav a.active{ color:var(--gold); }

  @media (max-width:420px){
    .bottom-nav a span{ display:none; }
  }
</style>
</head>

<script>
  const mushafs = [
    { title: "Al-Kourane : 1 - 114", count: 114 },
    { title: "Mushaf Daru Minan", count: 30 },
    { title: "Mushaf S. Abdou Lahad Souhibu", count: 30 },
    { title: "Mushaf Warsh", count: 30 },

    { title: "Saar al khourane", count: 6 }
  ];

  const list = document.getElementById('mushafList');
  mushafs.forEach(m=>{
    const item = document.createElement('div');
    item.className = 'mushaf-item';
    item.innerHTML = `
      <div class="mushaf-thumb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      </div>
      <div class="mushaf-info">
        <h3>${m.title}</h3>
        <span class="mushaf-badge">${m.count} éléments</span>
      </div>
      <svg class="mushaf-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    `;
    item.addEventListener('click', ()=> showToast(`« ${m.title} » sera bientôt disponible.`));
    list.appendChild(item);
  });

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  const toastEl = document.getElementById('toast');
  let toastTimer;
  function showToast(msg){
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2400);
  }

  ['navKaggu','navKhassida','navUtilites'].forEach(id=>{
    document.getElementById(id).addEventListener('click', (e)=>{
      e.preventDefault();
      showToast('Cette section sera ajoutée prochainement.');
    });
  });
</script>

</body>
